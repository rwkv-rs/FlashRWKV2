[build-system]
requires = [
  "setuptools>=77.0.3,<81.0.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "FlashRWKV2"
version = "0.1.0a16"
description = "TileLang RWKV-7 operators with shared BF16 training and inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.11,<2.15",
  "tilelang==0.1.15",
]
license = "MIT"

[dependency-groups]
dev = [
  "ninja>=1.11",
  "pytest>=8",
  "ruff>=0.12",
  "torch==2.14.1",
]

[project.urls]
Repository = "https://github.com/rwkv-rs/FlashRWKV2"

[tool.setuptools.packages.find]
include = ["flashrwkv2", "flashrwkv2.*"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
pythonpath = [".", "tests"]
norecursedirs = ["tests_old", "benchmarks_old"]
python_files = ["test.py", "test_*.py"]
markers = [
  "cuda: requires a CUDA GPU for TileLang or native operators",
  "cuda_graph: captures and replays a real CUDA Graph",
  "resource: validates compiled CUDA binary resource usage",
  "memcheck: minimal Compute Sanitizer memcheck coverage",
  "racecheck: minimal Compute Sanitizer racecheck coverage",
]
