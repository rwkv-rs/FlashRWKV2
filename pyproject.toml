[build-system]
requires = [
  "setuptools>=77.0.3,<81.0.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "FlashRWKV2"
version = "0.2.0a4"
description = "TileLang RWKV-7 operators with shared BF16 training and inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.11,<2.15",
  "tilelang==0.1.15",
]
license = "MIT"

[dependency-groups]
dev = [
  "ninja>=1.11",
  "pytest>=8",
  "ruff>=0.12",
  "torch==2.14.1",
]

[project.urls]
Repository = "https://github.com/rwkv-rs/FlashRWKV2"

[tool.setuptools.packages.find]
include = ["flashrwkv2", "flashrwkv2.*"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
pythonpath = [".", "tests", "benchmarks"]
norecursedirs = ["tests_old", "benchmarks_old"]
python_files = ["test.py", "test_*.py"]
markers = [
  "cuda: requires a CUDA GPU for TileLang or native operators",
  "cuda_graph: captures and replays a real CUDA Graph",
  "resource: validates compiled CUDA binary resource usage",
  "memcheck: minimal Compute Sanitizer memcheck coverage",
  "racecheck: minimal Compute Sanitizer racecheck coverage",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["artifacts", "build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",    # Allow long schema strings and inline CUDA preludes
  "E402",    # Deferred imports after _extension() bootstrap in package __init__
  "B023",    # TileLang @T.macro / closure captures
  "SIM102",  # TileLang separates compile-time Python guards from runtime TIR branches
  "RUF001",  # Intentional typographic characters (×, −, ²) in docs/messages
  "RUF002",  # Intentional typographic characters in docstrings
  "RUF003",  # Intentional typographic characters in comments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
