[build-system]
requires = [
  "ninja",
  "setuptools>=77.0.3,<81.0.0",
  "torch==2.13.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "FlashRWKV2"
version = "0.1.0a6"
description = "High-performance CUDA operator library for RWKV-7"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch==2.13.0",
]
license = "MIT"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
  "torch==2.13.0",
]

[project.urls]
Repository = "https://github.com/rwkv-rs/FlashRWKV2"

[tool.setuptools.packages.find]
include = ["flashrwkv2", "flashrwkv2.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = ["tests_old", "benchmarks_old"]
python_files = ["test.py", "test_*.py"]
