name: PyPI release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify without publishing (RTX4090 reports must be attached to its draft release)
        required: true
        type: string
  release:
    types: [published]

permissions:
  actions: read
  contents: read

concurrency:
  group: flashrwkv2-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Verify complete release acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag identity and main ancestry
        id: identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          timeout 60s git fetch origin main --no-tags
          test "$(timeout 30s git rev-parse HEAD)" = "$(timeout 30s git rev-list -n 1 "$RELEASE_TAG")"
          timeout 30s git merge-base --is-ancestor HEAD origin/main
          version="$(timeout 30s python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"
          test "$RELEASE_TAG" = "v$version"
          echo "commit=$(timeout 10s git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Download distributions and acceptance for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          run=$(timeout 60s gh run list --workflow pro6000-gpu.yml --branch "$TAG" --commit "$COMMIT" \
            --event workflow_dispatch --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$run"
          timeout 180s gh run download "$run" -n "dist-$COMMIT" -D release/payload/dist
          timeout 180s gh run download "$run" -n "gpu-$COMMIT" -D release/results
          timeout 90s gh release download "$TAG" --pattern sm89.json -D release/results
          timeout 30s python3 ci/quality_gate.py verify --dist release/payload/dist --output release/results
      - uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-release-${{ steps.identity.outputs.commit }}
          path: release/payload/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish original distributions to PyPI
    if: github.event_name == 'release'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/flashrwkv2/${{ needs.prepare.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-release-${{ needs.prepare.outputs.commit }}
          path: release/payload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/payload/dist/

  verify-pypi:
    name: Verify public PyPI SHA256
    if: github.event_name == 'release'
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-release-${{ needs.prepare.outputs.commit }}
          path: release/payload
      - name: Compare public files with the tested originals
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          timeout 240s python3 - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.request
          from pathlib import Path
          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path('release/payload/dist').iterdir()
          }
          url = f"https://pypi.org/pypi/flashrwkv2/{os.environ['VERSION']}/json"
          public = {}
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      payload = json.load(response)
                  public = {row['filename']: row['digests']['sha256'] for row in payload['urls']}
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              if all(public.get(name) == digest for name, digest in expected.items()):
                  break
              if attempt < 5:
                  time.sleep(10)
          mismatches = {
              name: {'expected': digest, 'public': public.get(name)}
              for name, digest in expected.items() if public.get(name) != digest
          }
          if mismatches:
              raise SystemExit(f'PyPI publication verification failed: {mismatches}')
          print(json.dumps({'verified': expected}, indent=2))
          PY
