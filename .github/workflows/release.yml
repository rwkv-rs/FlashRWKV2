name: PyPI release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify without publishing (RTX4090 reports must be attached to its draft release)
        required: true
        type: string
  release:
    types: [published]

permissions:
  actions: read
  contents: read

concurrency:
  group: flashrwkv2-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Verify complete release acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.identity.outputs.version }}
      source_tree_sha: ${{ steps.plan.outputs.source_tree_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag identity and main ancestry
        id: identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          timeout 60s git fetch origin main --no-tags
          test "$(timeout 30s git rev-parse HEAD)" = "$(timeout 30s git rev-list -n 1 "$RELEASE_TAG")"
          timeout 30s git merge-base --is-ancestor HEAD origin/main
          version="$(timeout 30s python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"
          test "$RELEASE_TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require full validation, all Torch versions, and cold compilation
        id: plan
        run: |
          timeout 60s python3 ci/quality_gate.py plan \
            --base "$(timeout 30s git rev-parse HEAD^)" \
            --head "$(timeout 30s git rev-parse HEAD)" --mode full --extended \
            --output release/plan.json --github-output "$GITHUB_OUTPUT"
      - name: Resolve the tested source distribution bundle
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 300s python3 ci/quality_gate.py resolve \
            --plan release/plan.json --repository "$GITHUB_REPOSITORY" \
            --current-run "$GITHUB_RUN_ID" --output release/reuse.json \
            --github-output "$GITHUB_OUTPUT"
          timeout 30s python3 - <<'PY'
          import json
          from pathlib import Path
          if not json.loads(Path('release/reuse.json').read_text())['complete']:
              raise SystemExit('release requires a successful full extended Quality Gate for this exact source tree')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.reuse.outputs.artifact }}
          run-id: ${{ steps.reuse.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release/tested
      - name: Verify both architectures, full performance, versions, and original SHA256
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          timeout 300s python3 ci/quality_gate.py release \
            --plan release/plan.json --bundle release/tested \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --output release/payload
      - uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-release-v7-${{ steps.plan.outputs.source_tree_sha }}
          path: release/payload/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish original distributions to PyPI
    if: github.event_name == 'release'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/flashrwkv2/${{ needs.prepare.outputs.version }}/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-release-v7-${{ needs.prepare.outputs.source_tree_sha }}
          path: release/payload
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release/payload/dist/

  verify-pypi:
    name: Verify public PyPI SHA256
    if: github.event_name == 'release'
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-release-v7-${{ needs.prepare.outputs.source_tree_sha }}
          path: release/payload
      - name: Compare public files with the tested originals
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          timeout 240s python3 - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.request
          from pathlib import Path
          expected = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in Path('release/payload/dist').iterdir()
          }
          url = f"https://pypi.org/pypi/flashrwkv2/{os.environ['VERSION']}/json"
          public = {}
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      payload = json.load(response)
                  public = {row['filename']: row['digests']['sha256'] for row in payload['urls']}
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
              if all(public.get(name) == digest for name, digest in expected.items()):
                  break
              if attempt < 5:
                  time.sleep(10)
          mismatches = {
              name: {'expected': digest, 'public': public.get(name)}
              for name, digest in expected.items() if public.get(name) != digest
          }
          if mismatches:
              raise SystemExit(f'PyPI publication verification failed: {mismatches}')
          print(json.dumps({'verified': expected}, indent=2))
          PY
