name: Fast CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact current main revision to retry
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: Fast CI / contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Resolve immutable comparison
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          DISPATCH_HEAD: ${{ inputs.source_revision }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            head="$DISPATCH_HEAD"
            if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "source_revision must be a full lowercase Git OID: $head" >&2
              exit 1
            fi
            if [[ "$(git rev-parse origin/main)" != "$head" ]]; then
              echo "source_revision must be the current main revision" >&2
              exit 1
            fi
            base="$(git rev-parse "$head^")"
          else
            base="$PUSH_BASE"
            head="$PUSH_HEAD"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "$head^")"
            fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: Select affected validation targets
        id: impact
        run: |
          python3 ci/select_targets.py \
            --base '${{ steps.revision.outputs.base }}' \
            --head '${{ steps.revision.outputs.head }}' \
            --output artifacts/impact.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Synchronize locked CPU environment
        if: steps.impact.outputs.change_class != 'documentation'
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: uv sync --frozen --no-install-project --group dev
      - name: Check changed-file whitespace
        run: >-
          git diff --check '${{ steps.revision.outputs.base }}'
          '${{ steps.revision.outputs.head }}' --
      - name: Check maintained Python and repository whitespace
        if: steps.impact.outputs.change_class != 'documentation'
        run: |
          .venv/bin/ruff check --select E9,F63,F7,F82 \
            flashrwkv2 tests benchmarks setup.py
          .venv/bin/ruff check ci
      - name: Validate CI helpers
        if: steps.impact.outputs.change_class != 'documentation'
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONPATH: ${{ github.workspace }}
        run: |
          .venv/bin/python ci/select_targets.py --self-test
          .venv/bin/python ci/benchmark_gate.py self-test
      - name: Run CPU-visible API and validation tests
        if: steps.impact.outputs.change_class != 'documentation'
        env:
          CUDA_VISIBLE_DEVICES: ""
          PYTHONPATH: ${{ github.workspace }}
        run: .venv/bin/python -m pytest -q -m 'not sm90 and not sm120'
      - name: Upload revision-bound impact contract
        uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-impact-${{ steps.revision.outputs.head }}
          path: artifacts/impact.json
          if-no-files-found: error
          retention-days: 90
