name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: flashrwkv2-quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON: '3.12'

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      trusted: ${{ steps.trust.outputs.trusted }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve GPU trust boundary
        id: trust
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('trusted', 'true');
              return;
            }
            const pull = context.payload.pull_request;
            let trusted = pull.head.repo?.full_name === process.env.GITHUB_REPOSITORY &&
              new Set(['OWNER', 'MEMBER', 'COLLABORATOR']).has(pull.author_association);
            if (!trusted && pull.head.repo?.full_name === process.env.GITHUB_REPOSITORY &&
                pull.author_association === 'CONTRIBUTOR') {
              const {data} = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username: pull.user.login,
              });
              trusted = new Set(['admin', 'maintain', 'write']).has(data.permission);
            }
            core.setOutput('trusted', String(trusted));
      - uses: astral-sh/setup-uv@v6
      - name: Build distributions and run source contracts
        run: |
          timeout 300s uv build --out-dir dist
          timeout 600s uv sync --frozen --group dev
          timeout 60s .venv/bin/ruff check ci benchmarks
          timeout 60s .venv/bin/ruff check --select E9,F63,F7,F82 flashrwkv2 tests
          CUDA_VISIBLE_DEVICES="" timeout 600s .venv/bin/python -m pytest -q -m 'not cuda and not resource'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  gpu:
    name: GPU validation
    needs: package
    if: needs.package.outputs.trusted == 'true'
    runs-on: [self-hosted, linux, x64, rwkv-sha-pro6000x8]
    timeout-minutes: 360
    concurrency:
      group: flashrwkv2-pro6000-exclusive
      cancel-in-progress: false
      queue: max
    env:
      CUDA_VISIBLE_DEVICES: '0,1'
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: artifacts/${{ github.run_id }}/dist
      - uses: astral-sh/setup-uv@v6
      - name: Test the wheel and measure each owner
        env:
          OUTPUT: artifacts/${{ github.run_id }}
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          timeout 600s uv sync --frozen --no-install-project --group dev
          timeout 120s uv pip install --python .venv/bin/python --no-deps --reinstall "$OUTPUT"/dist/*.whl
          args=()
          if [ "$RELEASE" = true ]; then args+=(--release); fi
          PATH="$PWD/.venv/bin:$PATH" timeout 18500s .venv/bin/python -I ci/quality_gate.py validate \
            --dist "$OUTPUT/dist" --output "$OUTPUT/gpu" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-${{ github.sha }}
          path: artifacts/${{ github.run_id }}/gpu/
          if-no-files-found: error
      - name: Remove this run's uploaded artifacts
        if: always()
        run: timeout 30s rm -rf "artifacts/${{ github.run_id }}"

  gate:
    name: Quality Gate
    if: always()
    needs: [package, gpu]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require package and GPU success
        env:
          PACKAGE: ${{ needs.package.result }}
          GPU: ${{ needs.gpu.result }}
        run: test "$PACKAGE" = success && test "$GPU" = success
