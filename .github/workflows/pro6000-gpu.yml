name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: flashrwkv2-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan source validation
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      source_tree_sha: ${{ steps.plan.outputs.source_tree_sha }}
      build_input_hash: ${{ steps.plan.outputs.build_input_hash }}
      run_gpu: ${{ steps.plan.outputs.run_gpu }}
      affected_cuda_modules: ${{ steps.plan.outputs.affected_cuda_modules }}
      cuda_racecheck_modules: ${{ steps.plan.outputs.cuda_racecheck_modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate CI contracts and create plan
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          python3 ci/select_targets.py --self-test
          python3 ci/quality_gate.py self-test
          python3 ci/quality_gate.py plan \
            --base "$BASE_SHA" \
            --head "$(git rev-parse HEAD)" \
            --output artifacts/plan.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-plan-v5-${{ steps.plan.outputs.source_tree_sha }}
          path: artifacts/plan.json
          if-no-files-found: error

  package:
    name: Build source distributions
    needs: [plan, contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Build without Torch or CUDA
        run: uv build --out-dir artifacts/dist
      - name: Verify universal source wheel and sdist
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path("artifacts/dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("expected exactly one wheel and one sdist")
          wheel, sdist = wheels[0], sdists[0]
          if not wheel.name.endswith("-py3-none-any.whl"):
              raise SystemExit(f"wheel is not universal: {wheel.name}")

          sources = {
              path.relative_to("csrc").as_posix(): path.read_bytes()
              for path in Path("csrc").rglob("*")
              if path.is_file()
          }
          if not sources or not any(name.startswith("sm80/") for name in sources):
              raise SystemExit("repository CUDA source tree is incomplete")
          if any(name.startswith(("sm89/", "sm90/", "sm120/")) for name in sources):
              raise SystemExit("repository contains a duplicate architecture source tree")

          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              if any(name.endswith((".so", ".pyd", ".dll")) for name in names):
                  raise SystemExit("wheel contains a compiled extension")
              for relative, expected in sources.items():
                  name = f"flashrwkv2/_csrc/{relative}"
                  if name not in names or archive.read(name) != expected:
                      raise SystemExit(f"wheel source mismatch: {relative}")

          with tarfile.open(sdist) as archive:
              members = {member.name: member for member in archive.getmembers()}
              prefix = sdist.name.removesuffix(".tar.gz")
              if any(name.endswith((".so", ".pyd", ".dll")) for name in members):
                  raise SystemExit("sdist contains a compiled extension")
              for relative, expected in sources.items():
                  name = f"{prefix}/csrc/{relative}"
                  member = members.get(name)
                  if member is None or archive.extractfile(member).read() != expected:
                      raise SystemExit(f"sdist source mismatch: {relative}")

          Path("artifacts/package-validation.json").write_text(json.dumps({
              "checks": {
                  "package_identity": "passed",
                  "source_contents": "passed",
              },
              "artifacts": {
                  "wheel": {"name": wheel.name, "sha256": hashlib.sha256(wheel.read_bytes()).hexdigest()},
                  "sdist": {"name": sdist.name, "sha256": hashlib.sha256(sdist.read_bytes()).hexdigest()},
              },
          }, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-wheel-v5-${{ needs.plan.outputs.build_input_hash }}
          path: |
            artifacts/dist/*
            artifacts/package-validation.json
          if-no-files-found: error
          retention-days: 30

  contract:
    name: Source and CPU contract
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Validate source and helpers
        run: |
          git diff --check '${{ needs.plan.outputs.base_sha }}' HEAD --
          uv sync --frozen --no-install-project --group dev
          .venv/bin/ruff check --select E9,F63,F7,F82 flashrwkv2 tests benchmarks setup.py
          .venv/bin/ruff check ci benchmarks
          .venv/bin/python ci/select_targets.py --self-test
          .venv/bin/python ci/quality_gate.py self-test
          .venv/bin/python ci/benchmark_gate.py self-test
          CUDA_VISIBLE_DEVICES="" .venv/bin/python -m pytest -q tests/test_runtime.py

  untrusted:
    name: Reject untrusted GPU revision
    if: >-
      needs.plan.outputs.run_gpu == 'true' && github.event_name == 'pull_request' &&
      (github.event.pull_request.head.repo.full_name != github.repository ||
       !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Native GPU validation requires a reviewed in-repository revision.' >&2
          exit 1

  torch-source-compatibility:
    name: Torch ${{ matrix.torch }} runtime build
    if: >-
      needs.plan.outputs.run_gpu == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))
    needs: [plan, contract, package]
    runs-on: [self-hosted, linux, x64, rwkv-sha-pro6000x8]
    timeout-minutes: 180
    concurrency:
      group: flashrwkv2-pro6000-exclusive
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        torch: ["2.11.0", "2.12.0", "2.13.0"]
    env:
      TORCH_EXTENSIONS_DIR: ${{ runner.temp }}/flashrwkv2-${{ github.run_id }}-torch-${{ matrix.torch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-wheel-v5-${{ needs.plan.outputs.build_input_hash }}
          path: artifacts/package
      - uses: astral-sh/setup-uv@v6
      - name: Install the same source wheel
        env:
          TORCH_VERSION: ${{ matrix.torch }}
        run: |
          uv venv .venv --python 3.12 --clear
          uv pip install --python .venv/bin/python "torch==$TORCH_VERSION" pytest numpy ninja
          uv pip install --python .venv/bin/python --no-deps artifacts/package/dist/*.whl
      - name: Compile once and verify cache hit
        env:
          TORCH_VERSION: ${{ matrix.torch }}
        run: |
          .venv/bin/python -m flashrwkv2.compile > artifacts/compile-first.json
          .venv/bin/python -m flashrwkv2.compile > artifacts/compile-second.json
          .venv/bin/python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          first = json.loads(Path("artifacts/compile-first.json").read_text())
          second = json.loads(Path("artifacts/compile-second.json").read_text())
          if first["status"] not in {"compiled", "cached"} or second["status"] != "cached":
              raise SystemExit(f"unexpected runtime cache states: {first}, {second}")
          if first["target"] != "sm120" or second["cache_key"] != first["cache_key"]:
              raise SystemExit(f"unexpected runtime target/cache identity: {first}, {second}")
          library = Path(second["library"])
          if not library.is_file():
              raise SystemExit(f"runtime library is missing: {library}")
          listing = subprocess.run(
              ["cuobjdump", "--list-elf", str(library)],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          if "sm_120" not in listing or any(f"sm_{cc}" in listing for cc in (80, 89, 90)):
              raise SystemExit(f"runtime library is not native-only sm120:\n{listing}")
          Path(f"artifacts/validation-{os.environ['TORCH_VERSION']}.json").write_text(
              json.dumps({
                  "checks": {
                      f"torch_{os.environ['TORCH_VERSION'].split('.')[0]}_{os.environ['TORCH_VERSION'].split('.')[1]}": "passed",
                      "runtime_build_cache": "passed",
                  },
                  "environment": {
                      "target": second["target"],
                      "cache_key": second["cache_key"],
                      "library": second["library"],
                  },
                  "results": [],
              }, indent=2) + "\n"
          )
          PY
      - name: Full correctness, backward, and CUDA Graph suite
        if: matrix.torch == '2.13.0'
        run: .venv/bin/python -m pytest -q tests
      - name: Compute Sanitizer memcheck
        if: matrix.torch == '2.13.0'
        run: compute-sanitizer --error-exitcode=1 --tool memcheck .venv/bin/python -m pytest -q tests -m memcheck
      - name: Compute Sanitizer racecheck
        if: matrix.torch == '2.13.0'
        run: compute-sanitizer --error-exitcode=1 --tool racecheck .venv/bin/python -m pytest -q tests -m racecheck
      - name: Record complete CUDA coverage
        if: matrix.torch == '2.13.0'
        env:
          MODULES: ${{ needs.plan.outputs.affected_cuda_modules }}
          RACECHECK_MODULES: ${{ needs.plan.outputs.cuda_racecheck_modules }}
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("artifacts/validation-2.13.0.json")
          payload = json.loads(path.read_text())
          modules = json.loads(os.environ["MODULES"])
          racecheck = json.loads(os.environ["RACECHECK_MODULES"])
          payload["checks"].update({
              "cuda": "native-runtime",
              "cuda_graph": "passed",
              "memcheck": "passed",
              "racecheck": "passed",
          })
          payload["results"] = [
              {"kind": "correctness", "status": "passed", "modules": modules},
              {"kind": "memcheck", "status": "passed", "modules": modules},
              {"kind": "racecheck", "status": "passed", "modules": racecheck},
          ]
          path.write_text(json.dumps(payload, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-validation-torch-${{ matrix.torch }}-${{ needs.plan.outputs.source_tree_sha }}
          path: |
            artifacts/compile-*.json
            artifacts/validation-${{ matrix.torch }}.json
          if-no-files-found: error

  finalize:
    name: Bind exact artifacts and evidence
    if: >-
      always() && needs.plan.result == 'success' && needs.package.result == 'success' &&
      (needs.torch-source-compatibility.result == 'success' ||
       (needs.plan.outputs.run_gpu != 'true' && needs.torch-source-compatibility.result == 'skipped'))
    needs: [plan, contract, package, torch-source-compatibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-plan-v5-${{ needs.plan.outputs.source_tree_sha }}
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-wheel-v5-${{ needs.plan.outputs.build_input_hash }}
          path: artifacts/package
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.run_gpu == 'true'
        with:
          pattern: flashrwkv2-validation-torch-*-${{ needs.plan.outputs.source_tree_sha }}
          path: artifacts/validation
          merge-multiple: true
      - name: Merge validation evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = {"checks": {}, "environment": {}, "results": []}
          paths = [Path("artifacts/package/package-validation.json")]
          paths.extend(sorted(Path("artifacts/validation").glob("validation-*.json")))
          for path in paths:
              current = json.loads(path.read_text())
              payload["checks"].update(current.get("checks", {}))
              payload["environment"].update(current.get("environment", {}))
              payload["results"].extend(current.get("results", []))
          Path("artifacts/validation.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
      - name: Finalize and verify exact source distributions
        run: |
          python3 ci/quality_gate.py finalize \
            --plan artifacts/plan.json \
            --wheel artifacts/package/dist/*.whl \
            --sdist artifacts/package/dist/*.tar.gz \
            --validation artifacts/validation.json \
            --output artifacts/quality-manifest.json
          python3 ci/quality_gate.py verify \
            --manifest artifacts/quality-manifest.json \
            --expected-tree '${{ needs.plan.outputs.source_tree_sha }}' \
            --wheel artifacts/package/dist/*.whl \
            --sdist artifacts/package/dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-quality-v5-${{ needs.plan.outputs.source_tree_sha }}
          path: |
            artifacts/quality-manifest.json
            artifacts/package/dist/*
          if-no-files-found: error
          retention-days: 90
