name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Validation scope (performance includes full correctness first)
        type: choice
        options: [incremental, full, performance]
        default: full
      extended:
        description: All supported Torch versions, cold compilation, and full benchmarks
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: flashrwkv2-quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.mode || 'auto' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  UV_PYTHON: '3.12'

jobs:
  plan:
    name: Plan source validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      source_tree_sha: ${{ steps.plan.outputs.source_tree_sha }}
      run_gpu: ${{ steps.plan.outputs.run_gpu }}
      run_package: ${{ steps.plan.outputs.run_package }}
      run_contract: ${{ steps.plan.outputs.run_contract }}
      mode: ${{ steps.plan.outputs.mode }}
      extended: ${{ steps.plan.outputs.extended }}
      trusted: ${{ steps.trust.outputs.trusted }}
      reuse: ${{ steps.reuse.outputs.reuse }}
      reuse_run: ${{ steps.reuse.outputs.run_id }}
      reuse_artifact: ${{ steps.reuse.outputs.artifact }}
      run_performance: ${{ steps.scope.outputs.run_performance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve GPU trust boundary
        id: trust
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('trusted', 'true');
              return;
            }
            const pull = context.payload.pull_request;
            let trusted = pull.head.repo?.full_name === process.env.GITHUB_REPOSITORY &&
              new Set(['OWNER', 'MEMBER', 'COLLABORATOR']).has(pull.author_association);
            if (!trusted && pull.head.repo?.full_name === process.env.GITHUB_REPOSITORY &&
                pull.author_association === 'CONTRIBUTOR') {
              const {data} = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username: pull.user.login,
              });
              trusted = new Set(['admin', 'maintain', 'write']).has(data.permission);
            }
            core.setOutput('trusted', String(trusted));
      - name: Select incremental, daily, or extended validation
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          REQUESTED_MODE: ${{ inputs.mode || 'incremental' }}
          EXTENDED: ${{ inputs.extended || 'false' }}
          EVENT: ${{ github.event_name }}
        run: |
          if ! timeout 30s git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="$(timeout 30s git rev-parse HEAD^)"
          fi
          if [ "$EVENT" = schedule ]; then
            REQUESTED_MODE=full
            if [ "$(timeout 10s date -u +%u)" = 7 ]; then EXTENDED=true; fi
          fi
          args=()
          if [ "$EXTENDED" = true ]; then args+=(--extended); fi
          timeout 60s python3 ci/quality_gate.py plan \
            --base "$BASE_SHA" --head "$(timeout 30s git rev-parse HEAD)" \
            --mode "$REQUESTED_MODE" "${args[@]}" \
            --output artifacts/plan.json --github-output "$GITHUB_OUTPUT"
      - name: Resolve identical successful validation
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 300s python3 ci/quality_gate.py resolve \
            --plan artifacts/plan.json --repository "$GITHUB_REPOSITORY" \
            --current-run "$GITHUB_RUN_ID" --output artifacts/reuse.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Select independent performance work
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          timeout 30s python3 - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('artifacts/plan.json').read_text())
          run = (os.environ['EVENT'] == 'schedule' or plan['mode'] == 'performance'
                 or plan['extended'] or plan['impact']['change_class'] == 'benchmark')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run_performance={str(run).lower()}\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-plan-v7
          path: artifacts/plan.json
          if-no-files-found: error
          retention-days: 90

  contract:
    name: Source and CPU contract
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-plan-v7
          path: artifacts
      - name: Check source and CI contracts once
        env:
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
        run: |
          timeout 30s git diff --check "$BASE_SHA" HEAD --
          timeout 60s python3 ci/select_targets.py --self-test
          timeout 90s python3 ci/quality_gate.py self-test
          timeout 60s python3 ci/benchmark_gate.py self-test
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.reuse == 'true'
        with:
          name: ${{ needs.plan.outputs.reuse_artifact }}
          run-id: ${{ needs.plan.outputs.reuse_run }}
          github-token: ${{ github.token }}
          path: artifacts/reuse
      - uses: astral-sh/setup-uv@v6
        if: needs.plan.outputs.run_contract == 'true'
        with:
          enable-cache: true
      - name: Validate source and CPU behavior
        if: needs.plan.outputs.run_contract == 'true'
        run: |
          timeout 600s uv sync --frozen --no-install-project --group dev
          timeout 60s .venv/bin/ruff check --select E9,F63,F7,F82 flashrwkv2 tests benchmarks setup.py
          timeout 60s .venv/bin/ruff check ci benchmarks
          CUDA_VISIBLE_DEVICES="" timeout 600s .venv/bin/python ci/quality_gate.py test \
            --plan artifacts/plan.json --suite cpu --output artifacts/cpu.json \
            --reuse artifacts/reuse/quality-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashrwkv2-cpu-v7
          path: artifacts/cpu.*
          if-no-files-found: ignore
          retention-days: 90

  package:
    name: Verify source distributions
    if: needs.plan.outputs.run_package == 'true'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.reuse == 'true'
        with:
          name: ${{ needs.plan.outputs.reuse_artifact }}
          run-id: ${{ needs.plan.outputs.reuse_run }}
          github-token: ${{ github.token }}
          path: artifacts/package
      - uses: astral-sh/setup-uv@v6
        if: needs.plan.outputs.reuse != 'true'
      - name: Build without Torch or CUDA
        if: needs.plan.outputs.reuse != 'true'
        run: timeout 300s uv build --out-dir artifacts/package/dist
      - name: Verify Python and native package sources
        run: |
          timeout 60s python3 ci/quality_gate.py package \
            --directory artifacts/package --output artifacts/package/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-package-v7
          path: |
            artifacts/package/dist/*
            artifacts/package/package.json
          if-no-files-found: error
          retention-days: 90

  gpu:
    name: Affected GPU correctness and sanitizer
    if: >-
      needs.plan.outputs.run_gpu == 'true' && needs.plan.outputs.trusted == 'true'
    needs: [plan, contract, package]
    runs-on: [self-hosted, linux, x64, rwkv-sha-pro6000x8]
    timeout-minutes: 120
    concurrency:
      group: flashrwkv2-pro6000-exclusive
      cancel-in-progress: false
      queue: max
    env:
      CUDA_VISIBLE_DEVICES: '0,1'
      FLASHRWKV_PHYSICAL_GPU: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - name: Clean previous CI outputs while retaining the project environment
        run: timeout 30s rm -rf artifacts/ci
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-plan-v7
          path: artifacts/ci
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-package-v7
          path: artifacts/ci/package
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.reuse == 'true'
        with:
          name: ${{ needs.plan.outputs.reuse_artifact }}
          run-id: ${{ needs.plan.outputs.reuse_run }}
          github-token: ${{ github.token }}
          path: artifacts/ci/reuse
      - uses: astral-sh/setup-uv@v6
      - name: Synchronize the project environment
        run: |
          timeout 600s uv sync --frozen --no-install-project --group dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Validate the installed wheel or reuse matching GPU results
        run: |
          timeout 6600s python3 ci/quality_gate.py gpu \
            --plan artifacts/ci/plan.json --package artifacts/ci/package \
            --python .venv/bin/python --output artifacts/ci/results \
            --reuse artifacts/ci/reuse/quality-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashrwkv2-gpu-v7
          path: artifacts/ci/results/
          if-no-files-found: error
          retention-days: 90
      - name: Clean uploaded CI outputs
        if: always()
        run: timeout 30s rm -rf artifacts/ci

  gate:
    name: Quality Gate
    if: always()
    needs: [plan, contract, package, gpu]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every applicable validation job
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          timeout 30s python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['JOBS'])
          assert jobs['plan']['result'] == 'success', 'validation plan failed'
          assert jobs['contract']['result'] == 'success', 'CPU/CI contract failed'
          plan = jobs['plan']['outputs']
          for name, required in [('package', plan['run_package']), ('gpu', plan['run_gpu'])]:
              expected = 'success' if required == 'true' else 'skipped'
              assert jobs[name]['result'] == expected, f'{name}: required {expected}, got {jobs[name]["result"]}'
          PY
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-plan-v7
          path: artifacts
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.run_contract == 'true'
        with:
          name: flashrwkv2-cpu-v7
          path: artifacts/validation
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.run_package == 'true'
        with:
          name: flashrwkv2-package-v7
          path: artifacts/bundle
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.run_gpu == 'true'
        with:
          name: flashrwkv2-gpu-v7
          path: artifacts/gpu
      - name: Bind actual validation to the tested distributions
        env:
          RUN_GPU: ${{ needs.plan.outputs.run_gpu }}
          RUN_PACKAGE: ${{ needs.plan.outputs.run_package }}
        run: |
          timeout 30s mkdir -p artifacts/validation artifacts/bundle
          if [ "$RUN_GPU" = true ]; then timeout 30s cp artifacts/gpu/gpu.json artifacts/validation/gpu.json; fi
          args=()
          if [ "$RUN_PACKAGE" = true ]; then
            timeout 30s cp artifacts/bundle/package.json artifacts/validation/package.json
            args+=(--package artifacts/bundle)
          fi
          timeout 120s python3 ci/quality_gate.py finalize --plan artifacts/plan.json \
            --validation artifacts/validation "${args[@]}" --output artifacts/bundle/quality-manifest.json
          timeout 120s python3 ci/quality_gate.py verify --plan artifacts/plan.json \
            --manifest artifacts/bundle/quality-manifest.json "${args[@]}"
      - name: Report validation timing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 120s python3 ci/quality_gate.py summary --manifest artifacts/bundle/quality-manifest.json \
            --repository "$GITHUB_REPOSITORY" --output "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-quality-v7-${{ needs.plan.outputs.source_tree_sha }}
          path: artifacts/bundle/
          if-no-files-found: error
          retention-days: 90

  performance:
    name: Independent performance report
    if: needs.plan.outputs.run_performance == 'true' && needs.plan.outputs.trusted == 'true'
    needs: [plan, gate]
    runs-on: [self-hosted, linux, x64, rwkv-sha-pro6000x8]
    timeout-minutes: 240
    concurrency:
      group: flashrwkv2-pro6000-exclusive
      cancel-in-progress: false
      queue: max
    env:
      CUDA_VISIBLE_DEVICES: '0,1'
      FLASHRWKV_PHYSICAL_GPU: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false
          persist-credentials: false
      - name: Clean previous CI outputs
        run: timeout 30s rm -rf artifacts/ci
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-quality-v7-${{ needs.plan.outputs.source_tree_sha }}
          path: artifacts/ci/quality
      - uses: astral-sh/setup-uv@v6
      - name: Prepare the primary Torch environment and tested wheel
        run: |
          timeout 600s uv sync --frozen --no-install-project --group dev
          timeout 180s uv pip install --python .venv/bin/python --no-deps --reinstall artifacts/ci/quality/dist/*.whl
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Run affected standard cases or the complete tuning suite
        env:
          EXTENDED: ${{ needs.plan.outputs.extended }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          profile=standard
          if [ "$EXTENDED" = true ] || [ "$MODE" = performance ]; then profile=full; fi
          timeout 13800s .venv/bin/python ci/benchmark_gate.py report \
            --quality artifacts/ci/quality/quality-manifest.json --package artifacts/ci/quality \
            --profile "$profile" --repository "$GITHUB_REPOSITORY" \
            --python .venv/bin/python --output artifacts/ci/performance \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flashrwkv2-performance-v7-${{ needs.plan.outputs.source_tree_sha }}
          path: artifacts/ci/performance/
          if-no-files-found: error
          retention-days: 90
      - name: Clean uploaded CI outputs
        if: always()
        run: timeout 30s rm -rf artifacts/ci
