name: SM120 quality gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open in-repository pull request number
        required: false
        type: number
      source_revision:
        description: Exact approved pull request head revision
        required: true
        type: string
      accept_baseline:
        description: Publish a reviewed regression as the new approved baseline
        required: false
        default: false
        type: boolean
      approval_reason:
        description: Required audit reason when accepting a baseline
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: flashrwkv2-quality-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Select validation impact
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.revision.outputs.base_sha }}
      head_sha: ${{ steps.revision.outputs.head_sha }}
      pr_number: ${{ steps.revision.outputs.pr_number }}
      trusted: ${{ steps.revision.outputs.trusted }}
      publish_baseline: ${{ steps.revision.outputs.publish_baseline }}
      affected_modules: ${{ steps.targets.outputs.affected_modules }}
      benchmark_matrix: ${{ steps.targets.outputs.benchmark_matrix }}
      run_gpu: ${{ steps.targets.outputs.run_gpu }}
      run_benchmark: ${{ steps.targets.outputs.run_benchmark }}
      run_sanitizer: ${{ steps.targets.outputs.run_sanitizer }}
      run_all: ${{ steps.targets.outputs.run_all }}
      package_smoke_only: ${{ steps.targets.outputs.package_smoke_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve target and trust boundary
        id: revision
        uses: actions/github-script@v7
        env:
          DISPATCH_PR: ${{ inputs.pr_number }}
          DISPATCH_SHA: ${{ inputs.source_revision }}
          ACCEPT_BASELINE: ${{ inputs.accept_baseline }}
          APPROVAL_REASON: ${{ inputs.approval_reason }}
        with:
          script: |
            let baseSha;
            let headSha;
            let prNumber = '';
            let trusted = true;
            let publishBaseline = false;
            if (context.eventName === 'pull_request') {
              const pull = context.payload.pull_request;
              baseSha = pull.base.sha;
              headSha = pull.head.sha;
              prNumber = String(pull.number);
              trusted = !pull.draft &&
                pull.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pull.author_association);
            } else if (context.eventName === 'push') {
              publishBaseline = true;
              baseSha = context.payload.before;
              headSha = context.sha;
              if (/^0+$/.test(baseSha)) {
                const {data: commit} = await github.rest.repos.getCommit({
                  ...context.repo, ref: headSha,
                });
                if (!commit.parents.length) {
                  core.setFailed('initial main push has no comparison parent');
                  return;
                }
                baseSha = commit.parents[0].sha;
              }
            } else {
              prNumber = process.env.DISPATCH_PR;
              headSha = process.env.DISPATCH_SHA;
              if (!/^[0-9a-f]{40}$/.test(headSha)) {
                core.setFailed(`source_revision must be a full lowercase Git OID: ${headSha}`);
                return;
              }
              if (process.env.ACCEPT_BASELINE === 'true') {
                publishBaseline = true;
                if (context.ref !== 'refs/heads/main') {
                  core.setFailed('accepted baseline dispatches must run from the main ref');
                  return;
                }
                if (!process.env.APPROVAL_REASON.trim()) {
                  core.setFailed('approval_reason is required when accepting a baseline');
                  return;
                }
                const {data: permission} = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo, username: context.actor,
                });
                if (permission.permission !== 'admin') {
                  core.setFailed('only repository administrators may accept a regressed baseline');
                  return;
                }
                const {data: main} = await github.rest.repos.getBranch({
                  ...context.repo, branch: 'main',
                });
                const {data: comparison} = await github.rest.repos.compareCommits({
                  ...context.repo, base: headSha, head: main.commit.sha,
                });
                if (!['ahead', 'identical'].includes(comparison.status)) {
                  core.setFailed(`${headSha} is not an ancestor of main`);
                  return;
                }
                const {data: commit} = await github.rest.repos.getCommit({
                  ...context.repo, ref: headSha,
                });
                if (!commit.parents.length) {
                  core.setFailed('accepted baseline revision has no comparison parent');
                  return;
                }
                baseSha = commit.parents[0].sha;
                prNumber = '';
              } else {
                if (prNumber) {
                  const {data: pull} = await github.rest.pulls.get({
                    ...context.repo, pull_number: Number(prNumber),
                  });
                  if (pull.state !== 'open' || pull.head.sha !== headSha ||
                      pull.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                    core.setFailed('dispatch target is not the current head of an open in-repository PR');
                    return;
                  }
                  baseSha = pull.base.sha;
                } else {
                  if (context.ref !== 'refs/heads/main') {
                    core.setFailed('a main retry must be dispatched from the main ref');
                    return;
                  }
                  const {data: main} = await github.rest.repos.getBranch({
                    ...context.repo, branch: 'main',
                  });
                  if (main.commit.sha !== headSha) {
                    core.setFailed('a main retry must target the current main revision');
                    return;
                  }
                  const {data: commit} = await github.rest.repos.getCommit({
                    ...context.repo, ref: headSha,
                  });
                  if (!commit.parents.length) {
                    core.setFailed('current main revision has no comparison parent');
                    return;
                  }
                  baseSha = commit.parents[0].sha;
                  publishBaseline = true;
                }
              }
            }
            core.setOutput('base_sha', baseSha);
            core.setOutput('head_sha', headSha);
            core.setOutput('pr_number', prNumber);
            core.setOutput('trusted', String(trusted));
            core.setOutput('publish_baseline', String(publishBaseline));
      - name: Select affected modules
        id: targets
        run: |
          python3 ci/select_targets.py \
            --base '${{ steps.revision.outputs.base_sha }}' \
            --head '${{ steps.revision.outputs.head_sha }}' \
            --output artifacts/impact.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-impact-${{ steps.revision.outputs.head_sha }}
          path: artifacts/impact.json
          if-no-files-found: error
          retention-days: 90

  untrusted:
    name: Untrusted GPU revision
    needs: impact
    if: needs.impact.outputs.run_gpu == 'true' && needs.impact.outputs.trusted != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This revision requires native GPU validation but cannot execute on the self-hosted runner."
          echo "A maintainer must review it and move the exact revision to an in-repository branch."

  gpu-test:
    name: GPU test / sm120
    needs: impact
    if: needs.impact.outputs.run_gpu == 'true' && needs.impact.outputs.trusted == 'true'
    runs-on: [self-hosted, linux, x64, rwkv-sha-pro6000x8]
    timeout-minutes: 120
    concurrency:
      group: flashrwkv2-pro6000-exclusive
      cancel-in-progress: false
    env:
      TORCH_CUDA_ARCH_LIST: "12.0"
      CUDA_VISIBLE_DEVICES: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.impact.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Verify clean exact source
        env:
          EXPECTED_SHA: ${{ needs.impact.outputs.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --short --untracked-files=no)"
      - name: Build SM120 wheel from locked build contract
        run: |
          mkdir -p artifacts/wheels artifacts/test-results
          uv sync --frozen --no-install-project --group dev
          uv export --frozen --group dev --no-emit-project \
            --output-file artifacts/locked-requirements.txt
          uv build --wheel --out-dir artifacts/wheels 2>&1 | tee artifacts/wheel-build.log
          test "$(find artifacts/wheels -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
      - name: Install the wheel into a fresh runtime environment
        run: |
          uv venv --python 3.12 .runtime-venv
          uv pip install --python .runtime-venv/bin/python \
            -r artifacts/locked-requirements.txt
          uv pip install --python .runtime-venv/bin/python --no-deps \
            artifacts/wheels/*.whl
          smoke_root="$RUNNER_TEMP/flashrwkv2-wheel-smoke-$GITHUB_RUN_ID"
          mkdir -p "$smoke_root"
          cd "$smoke_root"
          "$GITHUB_WORKSPACE/.runtime-venv/bin/python" - <<'PY'
          import flashrwkv2
          import torch
          expected = "NVIDIA RTX PRO 6000 Blackwell Workstation Edition"
          if flashrwkv2._C is None:
              raise SystemExit("flashrwkv2._C did not load from the wheel")
          if torch.cuda.get_device_name(0) != expected:
              raise SystemExit(f"unexpected GPU: {torch.cuda.get_device_name(0)!r}")
          if torch.cuda.get_device_capability(0) != (12, 0):
              raise SystemExit(f"unexpected capability: {torch.cuda.get_device_capability(0)}")
          print(flashrwkv2._C.__file__)
          PY
      - name: Run affected GPU correctness tests
        if: needs.impact.outputs.package_smoke_only != 'true'
        env:
          MODULES_JSON: ${{ needs.impact.outputs.affected_modules }}
        run: |
          set -o pipefail
          test_root="$RUNNER_TEMP/flashrwkv2-gpu-tests-$GITHUB_RUN_ID"
          support_root="$RUNNER_TEMP/flashrwkv2-test-support-$GITHUB_RUN_ID"
          mkdir -p "$test_root"
          mkdir -p "$support_root"
          ln -s "$GITHUB_WORKSPACE/benchmarks" "$support_root/benchmarks"
          export PYTHONPATH="$support_root"
          for module in $(python3 -c 'import json,os; print(" ".join(json.loads(os.environ["MODULES_JSON"])))'); do
            safe="${module//\//-}"
            (
              cd "$test_root"
              "$GITHUB_WORKSPACE/.runtime-venv/bin/python" -m pytest -q \
                "$GITHUB_WORKSPACE/tests/$module" \
                -c /dev/null \
                -o 'python_files=test.py test_*.py' \
                --rootdir="$test_root" \
                --junitxml="$GITHUB_WORKSPACE/artifacts/test-results/$safe.xml"
            ) 2>&1 | tee "artifacts/test-results/$safe.log"
          done
          .runtime-venv/bin/python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = sorted(Path("artifacts/test-results").glob("*.xml"))
          if not paths:
              raise SystemExit("no module GPU test reports were produced")
          for path in paths:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
              skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
              if tests - skipped < 1:
                  raise SystemExit(f"{path} executed no non-skipped GPU tests")
          PY
      - name: Record benchmark environment contract
        if: needs.impact.outputs.run_benchmark == 'true'
        run: |
          wheel_sha="$(sha256sum artifacts/wheels/*.whl | cut -d' ' -f1)"
          FLASH_RWKV_WHEEL_SHA256="$wheel_sha" \
            .runtime-venv/bin/python ci/benchmark_gate.py probe-environment \
            --python .runtime-venv/bin/python \
            --output artifacts/benchmark-environment.json
      - name: Run affected Compute Sanitizer checks
        if: needs.impact.outputs.run_sanitizer == 'true'
        env:
          MODULES_JSON: ${{ needs.impact.outputs.affected_modules }}
        run: |
          command -v compute-sanitizer
          mkdir -p artifacts/sanitizer
          for module in $(python3 -c 'import json,os; print(" ".join(json.loads(os.environ["MODULES_JSON"])))'); do
            safe="${module//\//-}"
            compute-sanitizer --tool memcheck --target-processes all \
              --error-exitcode 97 \
              .runtime-venv/bin/python -m pytest -q "tests/$module" -x \
              2>&1 | tee "artifacts/sanitizer/$safe-memcheck.log"
            case "$module" in
              cmix/mix|cmix/sparse|rl_infctx/wkv7|sampling|tmix/mix6|tmix/wkv7)
                compute-sanitizer --tool racecheck --target-processes all \
                  --error-exitcode 98 \
                  .runtime-venv/bin/python -m pytest -q "tests/$module" -x \
                  2>&1 | tee "artifacts/sanitizer/$safe-racecheck.log"
                ;;
            esac
          done
      - name: Record wheel and source identity
        env:
          HEAD_SHA: ${{ needs.impact.outputs.head_sha }}
        run: |
          .runtime-venv/bin/python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          wheel = next(Path("artifacts/wheels").glob("*.whl"))
          payload = {
              "head_sha": os.environ["HEAD_SHA"],
              "runtime_semantic_revision": subprocess.run(
                  ("git", "log", "-1", "--format=%H", "--", "csrc", "flashrwkv2", "setup.py"),
                  check=True, capture_output=True, text=True,
              ).stdout.strip(),
              "wheel": wheel.name,
              "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
          }
          Path("artifacts/build-identity.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          test -z "$(git status --short --untracked-files=no)"
      - name: Upload tested SM120 wheel and correctness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-sm120-test-${{ needs.impact.outputs.head_sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  benchmark-plan:
    name: Resolve benchmark baselines
    needs: [impact, gpu-test]
    if: needs.impact.outputs.run_benchmark == 'true' && needs.impact.outputs.trusted == 'true' && needs.gpu-test.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      needs_base_wheel: ${{ steps.resolve.outputs.needs_base_wheel }}
      measured_base_modules: ${{ steps.resolve.outputs.measured_base_modules }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.impact.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-sm120-test-${{ needs.impact.outputs.head_sha }}
          path: tested-artifact
      - name: Resolve compatible approved baselines
        id: resolve
        env:
          MODULES_JSON: ${{ needs.impact.outputs.affected_modules }}
          BASE_SHA: ${{ needs.impact.outputs.base_sha }}
        run: |
          python3 ci/benchmark_gate.py resolve-baselines \
            --repository "$GITHUB_REPOSITORY" \
            --modules "$MODULES_JSON" \
            --environment tested-artifact/benchmark-environment.json \
            --base-revision "$BASE_SHA" \
            --output artifacts/baseline-plan \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload revision-bound baseline plan
        uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-baseline-plan-${{ needs.impact.outputs.head_sha }}
          path: artifacts/baseline-plan/
          if-no-files-found: error
          retention-days: 90

  base-wheel:
    name: Build benchmark base wheel once
    needs: [impact, benchmark-plan]
    if: needs.benchmark-plan.outputs.needs_base_wheel == 'true'
    runs-on: [self-hosted, linux, x64, rwkv-sha-pro6000x8]
    timeout-minutes: 120
    concurrency:
      group: flashrwkv2-pro6000-exclusive
      cancel-in-progress: false
    env:
      TORCH_CUDA_ARCH_LIST: "12.0"
      CUDA_VISIBLE_DEVICES: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.impact.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Build exact base wheel once
        env:
          BASE_SHA: ${{ needs.impact.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --short --untracked-files=no)"
          mkdir -p artifacts/base-wheels
          uv sync --frozen --no-install-project --group dev
          uv export --frozen --group dev --no-emit-project \
            --output-file artifacts/base-locked-requirements.txt
          uv build --wheel --out-dir artifacts/base-wheels
          test "$(find artifacts/base-wheels -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
      - name: Smoke-test exact base wheel
        run: |
          uv venv --python 3.12 .base-smoke-venv
          uv pip install --python .base-smoke-venv/bin/python \
            -r artifacts/base-locked-requirements.txt
          uv pip install --python .base-smoke-venv/bin/python --no-deps \
            artifacts/base-wheels/*.whl
          smoke_root="$RUNNER_TEMP/flashrwkv2-base-smoke-$GITHUB_RUN_ID"
          mkdir -p "$smoke_root"
          cd "$smoke_root"
          "$GITHUB_WORKSPACE/.base-smoke-venv/bin/python" - <<'PY'
          import flashrwkv2
          import torch
          if flashrwkv2._C is None:
              raise SystemExit("base flashrwkv2._C did not load from the wheel")
          if torch.cuda.get_device_capability(0) != (12, 0):
              raise SystemExit(f"unexpected capability: {torch.cuda.get_device_capability(0)}")
          print(flashrwkv2._C.__file__)
          PY
      - name: Record immutable base identity
        env:
          BASE_SHA: ${{ needs.impact.outputs.base_sha }}
        run: |
          .base-smoke-venv/bin/python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          wheel = next(Path("artifacts/base-wheels").glob("*.whl"))
          payload = {
              "base_sha": os.environ["BASE_SHA"],
              "wheel": wheel.name,
              "wheel_sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
          }
          Path("artifacts/base-build-identity.json").write_text(
              json.dumps(payload, indent=2) + "\n"
          )
          PY
      - name: Upload exact base wheel
        uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-sm120-base-${{ needs.impact.outputs.base_sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  benchmark:
    name: Benchmark / ${{ matrix.target.module }}
    needs: [impact, gpu-test, benchmark-plan, base-wheel]
    if: always() && needs.impact.outputs.run_benchmark == 'true' && needs.impact.outputs.trusted == 'true' && needs.gpu-test.result == 'success' && needs.benchmark-plan.result == 'success' && (needs.base-wheel.result == 'success' || needs.base-wheel.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(needs.impact.outputs.benchmark_matrix) }}
    runs-on: [self-hosted, linux, x64, rwkv-sha-pro6000x8]
    timeout-minutes: 90
    concurrency:
      group: flashrwkv2-pro6000-benchmark
      cancel-in-progress: false
    env:
      TORCH_CUDA_ARCH_LIST: "12.0"
      CUDA_VISIBLE_DEVICES: "0"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.impact.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-sm120-test-${{ needs.impact.outputs.head_sha }}
          path: tested-artifact
      - uses: actions/download-artifact@v4
        with:
          name: flashrwkv2-baseline-plan-${{ needs.impact.outputs.head_sha }}
          path: baseline-plan
      - uses: actions/download-artifact@v4
        if: needs.benchmark-plan.outputs.needs_base_wheel == 'true'
        with:
          name: flashrwkv2-sm120-base-${{ needs.impact.outputs.base_sha }}
          path: base-artifact
      - name: Prepare benchmark runtime from the tested wheel
        run: |
          uv venv --python 3.12 .benchmark-venv
          uv pip install --python .benchmark-venv/bin/python \
            -r tested-artifact/locked-requirements.txt
          uv pip install --python .benchmark-venv/bin/python --no-deps \
            tested-artifact/wheels/*.whl
          echo "FLASH_RWKV_WHEEL_SHA256=$(sha256sum tested-artifact/wheels/*.whl | cut -d' ' -f1)" \
            >> "$GITHUB_ENV"
          mkdir -p artifacts/benchmark
      - name: Run Head three times and prepare resolved baseline
        id: baseline
        env:
          MODULE: ${{ matrix.target.module }}
          SAFE_MODULE: ${{ matrix.target.safe }}
          HEAD_SHA: ${{ needs.impact.outputs.head_sha }}
          BASE_SHA: ${{ needs.impact.outputs.base_sha }}
        run: |
          python3 ci/benchmark_gate.py run \
            --module "$MODULE" \
            --python .benchmark-venv/bin/python \
            --revision "$HEAD_SHA" \
            --output "artifacts/benchmark/$SAFE_MODULE-head.json"
          source="$(python3 -c \
            'import json,os; print(json.load(open("baseline-plan/plan.json"))["sources"][os.environ["MODULE"]])')"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          if [[ "$source" = "approved-artifact" ]]; then
            cp "baseline-plan/$SAFE_MODULE-baseline.json" \
              "artifacts/benchmark/$SAFE_MODULE-baseline.json"
            exit 0
          fi
          if [[ "$source" = "new-module-bootstrap" ]]; then
            echo "No base benchmark exists for new module $MODULE; bootstrapping from validated head evidence."
            exit 0
          fi
          test "$source" = "measured-base"
          echo "No compatible approved artifact was found; measuring the base with the shared base wheel."
          base_root="$RUNNER_TEMP/flashrwkv2-base-$SAFE_MODULE"
          trap 'git worktree remove --force "$base_root" >/dev/null 2>&1 || true' EXIT
          git worktree add --detach "$base_root" "$BASE_SHA"
          uv venv --python 3.12 "$RUNNER_TEMP/base-venv-$SAFE_MODULE"
          uv pip install --python "$RUNNER_TEMP/base-venv-$SAFE_MODULE/bin/python" \
            -r base-artifact/base-locked-requirements.txt
          uv pip install --python "$RUNNER_TEMP/base-venv-$SAFE_MODULE/bin/python" \
            --no-deps base-artifact/base-wheels/*.whl
          FLASH_RWKV_SOURCE_ROOT="$base_root" \
            FLASH_RWKV_WHEEL_SHA256="$(sha256sum base-artifact/base-wheels/*.whl | cut -d' ' -f1)" \
            python3 ci/benchmark_gate.py run \
            --module "$MODULE" \
            --python "$RUNNER_TEMP/base-venv-$SAFE_MODULE/bin/python" \
            --revision "$BASE_SHA" \
            --output "artifacts/benchmark/$SAFE_MODULE-baseline.json"
          git worktree remove "$base_root"
          trap - EXIT
      - name: Enforce the 0.2 percent regression gate
        id: comparison
        env:
          SAFE_MODULE: ${{ matrix.target.safe }}
          BASELINE_SOURCE: ${{ steps.baseline.outputs.source }}
          ACCEPT_BASELINE: ${{ inputs.accept_baseline }}
          APPROVAL_REASON: ${{ inputs.approval_reason }}
        run: |
          if [[ "$BASELINE_SOURCE" = "new-module-bootstrap" ]]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          safe = os.environ["SAFE_MODULE"]
          head = json.loads(Path(f"artifacts/benchmark/{safe}-head.json").read_text())
          if head.get("independent_runs") != 3 or not head.get("profiles"):
              raise SystemExit("new-module benchmark bootstrap lacks complete three-run evidence")
          payload = {
              "schema_version": 1,
              "module": head["module"],
              "head_revision": head["revision"],
              "baseline_source": "new-module-bootstrap",
              "passed": True,
          }
          Path(f"artifacts/benchmark/{safe}-comparison.json").write_text(
              json.dumps(payload, indent=2) + "\n"
          )
          PY
            exit 0
          fi
          set +e
          python3 ci/benchmark_gate.py compare \
            --baseline "artifacts/benchmark/$SAFE_MODULE-baseline.json" \
            --head "artifacts/benchmark/$SAFE_MODULE-head.json" \
            --output "artifacts/benchmark/$SAFE_MODULE-comparison.json"
          status=$?
          set -e
          if [[ "$status" -ne 0 && "$ACCEPT_BASELINE" != "true" ]]; then
            exit "$status"
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "Administrator accepted this measured regression: ${{ inputs.approval_reason }}"
          fi
      - name: Upload revision-bound benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-benchmark-${{ matrix.target.safe }}-${{ needs.impact.outputs.head_sha }}
          path: artifacts/benchmark/
          if-no-files-found: error
          retention-days: 90
      - name: Publish approved main baseline
        if: success() && needs.impact.outputs.publish_baseline == 'true'
        env:
          SAFE_MODULE: ${{ matrix.target.safe }}
          ACCEPT_BASELINE: ${{ inputs.accept_baseline }}
          APPROVAL_REASON: ${{ inputs.approval_reason }}
        run: |
          args=()
          reason="validated main quality gate"
          if [[ "$ACCEPT_BASELINE" == "true" ]]; then
            args+=(--admin)
            reason="$APPROVAL_REASON"
          fi
          python3 ci/benchmark_gate.py approve \
            --candidate "artifacts/benchmark/$SAFE_MODULE-head.json" \
            --output "artifacts/benchmark/$SAFE_MODULE-approved.json" \
            --actor "$GITHUB_ACTOR" \
            --reason "$reason" \
            "${args[@]}"
      - name: Upload approved main baseline
        if: success() && needs.impact.outputs.publish_baseline == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flashrwkv2-baseline-sm120-${{ matrix.target.safe }}
          path: artifacts/benchmark/${{ matrix.target.safe }}-approved.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Quality Gate / aggregate
    needs: [impact, untrusted, gpu-test, benchmark-plan, base-wheel, benchmark]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce complete required evidence
        env:
          RUN_GPU: ${{ needs.impact.outputs.run_gpu }}
          RUN_BENCHMARK: ${{ needs.impact.outputs.run_benchmark }}
          TRUSTED: ${{ needs.impact.outputs.trusted }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          GPU_RESULT: ${{ needs.gpu-test.result }}
          BENCHMARK_PLAN_RESULT: ${{ needs.benchmark-plan.result }}
          BASE_WHEEL_RESULT: ${{ needs.base-wheel.result }}
          NEEDS_BASE_WHEEL: ${{ needs.benchmark-plan.outputs.needs_base_wheel }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        run: |
          test "$IMPACT_RESULT" = "success"
          if [[ "$RUN_GPU" != "true" ]]; then
            echo "GPU not required for this change."
            exit 0
          fi
          if [[ "$TRUSTED" != "true" ]]; then
            echo "Required GPU validation was not executed for this untrusted revision." >&2
            exit 1
          fi
          test "$GPU_RESULT" = "success"
          if [[ "$RUN_BENCHMARK" == "true" ]]; then
            test "$BENCHMARK_PLAN_RESULT" = "success"
            if [[ "$NEEDS_BASE_WHEEL" == "true" ]]; then
              test "$BASE_WHEEL_RESULT" = "success"
            else
              test "$BASE_WHEEL_RESULT" = "skipped"
            fi
            test "$BENCHMARK_RESULT" = "success"
          fi
      - name: Download benchmark reports for the pull request summary
        if: always() && github.event_name == 'pull_request' && needs.impact.outputs.run_benchmark == 'true' && needs.impact.outputs.trusted == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: flashrwkv2-benchmark-*-${{ needs.impact.outputs.head_sha }}
          path: benchmark-reports
          merge-multiple: true
      - name: Update sticky pull request report
        if: always() && github.event_name == 'pull_request' && needs.impact.outputs.trusted == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.impact.outputs.pr_number }}
          HEAD_SHA: ${{ needs.impact.outputs.head_sha }}
          MODULES: ${{ needs.impact.outputs.affected_modules }}
          GPU_RESULT: ${{ needs.gpu-test.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- flashrwkv2-quality-gate -->';
            const details = [];
            const root = 'benchmark-reports';
            if (fs.existsSync(root)) {
              for (const name of fs.readdirSync(root).sort()) {
                if (!name.endsWith('-comparison.json')) continue;
                const report = JSON.parse(fs.readFileSync(path.join(root, name), 'utf8'));
                for (const row of report.results) {
                  details.push(
                    `- \`${report.module}/${row.profile}\`: ` +
                    `base=${row.baseline_mean.toFixed(6)}, ` +
                    `head=${row.head_mean.toFixed(6)}, ` +
                    `regression=${(row.regression * 100).toFixed(4)}%, ` +
                    `passed=${row.passed}`);
                }
              }
            }
            const lines = [
              marker,
              '### FlashRWKV2 SM120 quality gate',
              '',
              `- Head: \`${process.env.HEAD_SHA}\``,
              `- Modules: \`${process.env.MODULES}\``,
              `- GPU correctness / sanitizer: \`${process.env.GPU_RESULT}\``,
              `- Three-run performance gate: \`${process.env.BENCHMARK_RESULT}\``,
              `- Regression limit: \`0.2%\``,
              `- Evidence: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ];
            if (details.length) lines.push('', '#### Performance', '', ...details);
            const body = lines.join('\n');
            const {data: comments} = await github.rest.issues.listComments({
              ...context.repo, issue_number: Number(process.env.PR_NUMBER),
            });
            const previous = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo, comment_id: previous.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: Number(process.env.PR_NUMBER), body,
              });
            }
